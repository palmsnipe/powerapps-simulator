Screens:
  Main:
    Properties:
      Fill: =RGBA(247, 249, 252, 1)
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            Text: ="AI task desk"
            X: =24
            Y: =24
            Width: =Parent.Width - 48
            Height: =48
            Size: =28
      - TaskCount:
          Control: ModernText@1.0.0
          Properties:
            Text: =CountRows(TaskGallery.AllItems) & " tasks"
            X: =24
            Y: =80
            Width: =Parent.Width - 48
            Height: =28
            Size: =18
      - NewTitle:
          Control: ModernTextInput@1.1.2
          Properties:
            AccessibleLabel: ="New task title"
            Default: =""
            X: =24
            Y: =124
            Width: =Parent.Width - 48
            Height: =44
      - AddTask:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Add task"
            AccessibleLabel: ="Add task"
            DisplayMode: =If(IsBlank(Trim(NewTitle.Text)), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |
              =If(!IsBlank(Trim(NewTitle.Text)), IfError(Patch(Tasks, Defaults(Tasks), {Title: Trim(NewTitle.Text), Done: false}), false, Reset(NewTitle)))
            X: =24
            Y: =180
            Width: =140
            Height: =44
      - TaskGallery:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =Tasks
            X: =24
            Y: =248
            Width: =Parent.Width - 48
            Height: =Parent.Height - 272
            TemplateSize: =76
            TemplateWidth: =Self.Width
          Children:
            - TaskTitle:
                Control: ModernText@1.0.0
                Properties:
                  Text: =ThisItem.Title
                  X: =8
                  Y: =6
                  Width: =Parent.TemplateWidth - 144
                  Height: =64
                  Size: =18
            - ToggleTask:
                Control: ModernButton@1.0.0
                Properties:
                  Text: =If(ThisItem.Done, "Reopen", "Complete")
                  AccessibleLabel: ="Toggle " & ThisItem.Title
                  OnSelect: |
                    =Patch(Tasks, LookUp(Tasks, ID = ThisItem.ID), {Done: !ThisItem.Done})
                  X: =Parent.TemplateWidth - 120
                  Y: =16
                  Width: =104
                  Height: =44
