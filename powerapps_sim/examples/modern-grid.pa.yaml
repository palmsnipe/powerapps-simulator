Screens:
  GridLab:
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            Text: =T("Modern grids · search, sorting and selection","Grilles modernes · recherche, tri et sélection")
            X: =20
            Y: =8
            Width: =1000
            Size: =22
      - LeftPanel:
          Control: CanvasComponent
          Properties:
            X: =20
            Y: =48
            Rows: =Drafts
            Caption: =T("Left drafts","Brouillons gauche")
            T: =If(StartsWith(Language(),"fr"),fr,en)
            Picked: =Set(selected,pick);Collect(events,{Panel:"Left",ID:pick.ID})
          ComponentName: GridPanel
      - RightPanel:
          Control: CanvasComponent
          Properties:
            X: =530
            Y: =48
            Rows: =Drafts
            Caption: =T("Right drafts","Brouillons droite")
            T: =If(StartsWith(Language(),"fr"),fr,en)
            Picked: =Set(selected,pick);Collect(events,{Panel:"Right",ID:pick.ID})
          ComponentName: GridPanel
      - Summary:
          Control: ModernText@1.0.0
          Properties:
            X: =20
            Y: =420
            Width: =1000
            Text: '=T("Left selected: ","Gauche sélection: ") & Text(CountRows(LeftPanel.Selection)) & " · " & T("Right selected: ","Droite sélection: ") & Text(CountRows(RightPanel.Selection)) & " · " & status'
      - DraftForm:
          Control: Form@2.4.4
          Properties:
            X: =20
            Y: =470
            Width: =760
            Height: =130
            DataSource: =Drafts
            Item: =Coalesce(LookUp(Drafts,ID=selected.ID),First(Drafts))
            OnSuccess: =Set(status,T("Saved","Enregistré"))
            OnFailure: =Set(status,T("Save failed","Échec"))
          Children:
            - TitleCard:
                Control: TypedDataCard@1.0.7
                Properties:
                  DataField: ="Title"
                  Required: =true
                  Default: =ThisItem.Title
                  Update: =TitleInput.Text
                  Width: =760
                  Height: =120
                Children:
                  - TitleLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =T("Draft title","Titre du brouillon")
                        Width: =700
                  - TitleInput:
                      Control: ModernTextInput@1.0.0
                      Properties:
                        Y: =32
                        Width: =740
                        Default: =Parent.Default
                        AccessibleLabel: ="Draft title"
                  - TitleError:
                      Control: ModernText@1.0.0
                      Properties:
                        Y: =70
                        Width: =740
                        Text: =Parent.Error
                        Color: =Color.Red
      - Save:
          Control: ModernButton@1.0.0
          Properties:
            X: =810
            Y: =500
            Width: =190
            Text: =T("Save draft","Enregistrer")
            OnSelect: =SubmitForm(DraftForm)
      - ResetLeft:
          Control: ModernButton@1.0.0
          Properties:
            X: =20
            Y: =640
            Width: =160
            Text: =T("Reset left","Réinitialiser gauche")
            OnSelect: =Reset(LeftPanel)
      - ResetRight:
          Control: ModernButton@1.0.0
          Properties:
            X: =200
            Y: =640
            Width: =160
            Text: =T("Reset right","Réinitialiser droite")
            OnSelect: =Reset(RightPanel)
      - OpenLarge:
          Control: ModernButton@1.0.0
          Properties:
            X: =500
            Y: =640
            Width: =200
            Text: =T("Large grid","Grande grille")
            OnSelect: =Navigate(LargeLab)
  LargeLab:
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            X: =20
            Y: =8
            Width: =1000
            Text: =T("2,105 fictional rows","2 105 lignes fictives")
            Size: =22
      - BigGrid:
          Control: ModernDataGrid@1.1.0
          Properties:
            X: =20
            Y: =48
            Width: =1000
            Height: =540
            Items: =ForAll(Sequence(2105) As row,{ID:row.Value,Title:"Fictional row " & Text(row.Value)})
            DefaultSelectedItems: =FirstN(Self.Items,1)
            Searchable: =true
            Sortable: =true
            AccessibleLabel: ="Large fictional grid"
          Children:
            - NameColumn:
                Control: ModernDataGridColumn@1.1.0
                Properties:
                  FieldDisplayName: ="Fictional row"
                  Text: =ThisItem.Title
                  Width: =980
                Variant: Textual
      - SelectedRow:
          Control: ModernText@1.0.0
          Properties:
            X: =20
            Y: =610
            Width: =950
            Text: '="Selected row: " & Text(BigGrid.Selected.ID) & " · " & BigGrid.SearchText'
      - Back:
          Control: ModernButton@1.0.0
          Properties:
            X: =20
            Y: =660
            Width: =180
            Text: =T("Back to drafts","Retour aux brouillons")
            OnSelect: =Navigate(GridLab)
