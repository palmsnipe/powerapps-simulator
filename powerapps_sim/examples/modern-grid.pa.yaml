App:
  Properties:
    StartScreen: =GridLab
    OnStart: =Clear(events);Set(selected,{ID:1,Title:"",Amount:0});Set(status,T("Ready","Prêt"));Reset(LeftPanel);Reset(RightPanel)
    Formulas: =T(en:Text,fr:Text):Text=If(StartsWith(Language(),"fr"),fr,en);
ComponentDefinitions:
  GridPanel:
    AccessAppScope: false
    CustomProperties:
      Rows:
        PropertyKind: Input
        DataType: Table
        Default: =Table({ID:0,Title:"",Amount:0,Field1:"",Field2:"",Field3:"",Field4:"",Field5:"",Field6:"",Field7:"",Field8:"",Field9:"",Field10:"",Field11:"",Field12:"",Field13:"",Field14:"",Field15:"",Field16:"",Field17:"",Field18:""})
      Caption:
        PropertyKind: Input
        DataType: Text
        Default: ="Grid"
      T:
        PropertyKind: InputFunction
        ReturnType: Text
        Default: =en
        Parameters:
          - en:
              DataType: Text
              Default: =""
              IsOptional: true
          - fr:
              DataType: Text
              Default: =""
              IsOptional: true
      Picked:
        PropertyKind: Event
        ReturnType: None
        Default: =Blank()
        Parameters:
          - pick:
              DataType: Record
              Default: ={ID:0,Title:"",Amount:0}
              IsOptional: true
      History:
        PropertyKind: Output
        DataType: Table
        Default: =history
      Selection:
        PropertyKind: Output
        DataType: Table
        Default: =Grid.SelectedItems
      Current:
        PropertyKind: Output
        DataType: Record
        Default: =Grid.Selected
      Query:
        PropertyKind: Output
        DataType: Text
        Default: =Grid.SearchText
    Properties:
      Width: =500
      Height: =370
      OnReset: =Clear(history);Reset(Grid)
    Children:
      - CaptionText:
          Control: ModernText@1.0.0
          Properties:
            Text: =GridPanel.Caption
            Width: =470
            Height: =30
            Size: =18
      - Grid:
          Control: ModernDataGrid@1.1.0
          Properties:
            Y: =32
            Width: =490
            Height: =320
            Items: =GridPanel.Rows
            DefaultSelectedItems: =FirstN(GridPanel.Rows,1)
            Searchable: =true
            Sortable: =true
            SelectMultiple: =true
            ShowSelector: =true
            AccessibleLabel: =GridPanel.Caption
            OnChange: =Collect(history,{ID:Self.Selected.ID,Count:CountRows(Self.SelectedItems)});GridPanel.Picked({ID:Self.Selected.ID,Title:Self.Selected.Title,Amount:Self.Selected.Amount})
          Children:
            - TitleColumn:
                Control: ModernDataGridColumn@1.1.0
                Properties:
                  FieldDisplayName: =GridPanel.T("Draft","Brouillon")
                  Text: =ThisItem.Title
                  Width: =240
                Variant: Textual
            - AmountColumn:
                Control: ModernDataGridColumn@1.1.0
                Properties:
                  FieldDisplayName: =GridPanel.T("Amount","Montant")
                  Text: =ThisItem.Amount
                  Width: =150
                Variant: Textual
            - Extra1:
                Control: ModernDataGridColumn@1.1.0
                Properties:
                  FieldDisplayName: ="Field 1"
                  Text: =ThisItem.Field1
                  Width: =150
                Variant: Textual
