App:
  Properties:
    StartScreen: =ChoicesScreen
    OnStart: =Set(defaultStatus,"Draft"); Set(busy,false); Set(readOnly,false); ClearCollect(events,{Event:"start"})
ComponentDefinitions:
  ChoicePanel:
    AccessAppScope: false
    CustomProperties:
      Seed:
        PropertyKind: Input
        DataType: Record
        Default: ={Value:"Draft"}
      Current:
        PropertyKind: Output
        DataType: Record
        Default: =Picker.Selected
      Changed:
        PropertyKind: Event
        ReturnType: None
        Parameters:
          - chosen:
              DataType: Record
        Default: =Blank()
    Properties:
      Width: =300
      Height: =64
    Children:
      - Picker:
          Control: ModernDropdown@1.0.0
          Properties:
            Items: =["Draft","Submitted","Approved"]
            Default: =ChoicePanel.Seed
            AccessibleLabel: ="Component status"
            Width: =Parent.Width
            OnChange: =ChoicePanel.Changed(Self.Selected)
Screens:
  ChoicesScreen:
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Selection controls"
            X: =32
            Y: =16
            Width: =500
            Size: =24
      - Status:
          Control: ModernDropdown@1.0.0
          Properties:
            Items: =["Draft","Submitted","Approved"]
            Default: =defaultStatus
            DisplayMode: =If(readOnly,DisplayMode.View,DisplayMode.Edit)
            AccessibleLabel: ="Project status"
            X: =32
            Y: =68
            Width: =300
            OnChange: =Set(statusValue,Self.Selected); Collect(events,{Event:"status",Value:Self.Selected.Value})
      - Priority:
          Control: ModernRadio@1.0.0
          Properties:
            Items: =Table({ID:1,Label:"Low",Amount:25},{ID:2,Label:"Normal",Amount:50},{ID:3,Label:"High",Amount:100})
            Default: ={ID:1}
            ItemDisplayText: =ThisItem.Label
            DisplayMode: =If(readOnly,DisplayMode.View,DisplayMode.Edit)
            AccessibleLabel: ="Priority"
            X: =32
            Y: =130
            Width: =300
            OnChange: =Collect(events,{Event:"priority",Value:Self.Selected.Label})
      - Progress:
          Control: ModernProgressBar@1.0.0
          Properties:
            Value: =Priority.Selected.Amount
            Max: =100
            Indeterminate: =busy
            ProgressColor: =If(Priority.Selected.ID=3,ProgressColor.Success,ProgressColor.Brand)
            Thickness: =ProgressThickness.Large
            AccessibleLabel: ="Priority progress"
            X: =32
            Y: =252
            Width: =300
      - Loading:
          Control: ModernSpinner@1.1.0
          Properties:
            Label: ="Loading fictional records"
            LabelPosition: =SpinnerLabelPosition.After
            Visible: =busy
            X: =32
            Y: =280
            Width: =300
      - ToggleBusy:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Toggle loading"
            X: =32
            Y: =340
            Width: =160
            OnSelect: =Set(busy,!busy)
      - ResetChoices:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Reset choices"
            X: =208
            Y: =340
            Width: =140
            OnSelect: =Reset(Status); Reset(Priority); Reset(LeftChoice); Reset(RightChoice)
      - LeftChoice:
          Control: CanvasComponent
          ComponentName: ChoicePanel
          Properties:
            Seed: ={Value:"Draft"}
            Changed: =Set(LeftChoiceValue,chosen)
            X: =440
            Y: =68
      - RightChoice:
          Control: CanvasComponent
          ComponentName: ChoicePanel
          Properties:
            Seed: ={Value:"Approved"}
            Changed: =Set(RightChoiceValue,chosen)
            X: =440
            Y: =150
      - ToggleView:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Toggle read-only"
            X: =364
            Y: =340
            Width: =170
            OnSelect: =Set(readOnly,!readOnly)
