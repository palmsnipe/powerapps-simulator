App:
  Properties:
    StartScreen: =ClassicScreen
    OnStart: =Set(status,"Ready");Set(angle,0);Clear(history)
ComponentDefinitions:
  ClassicPanel:
    AccessAppScope: false
    CustomProperties:
      Caption:
        PropertyKind: Input
        DataType: Text
        Default: ="Panel"
      Seed:
        PropertyKind: Input
        DataType: Number
        Default: =0
      Total:
        PropertyKind: Output
        DataType: Number
        Default: =Coalesce(current,ClassicPanel.Seed)
      Increase:
        PropertyKind: Action
        ReturnType: Number
        Parameters:
          - step:
              DataType: Number
              Default: =1
              IsOptional: true
        Default: =Set(current,ClassicPanel.Total+step);ClassicPanel.Changed(ClassicPanel.Total);ClassicPanel.Total
      Changed:
        PropertyKind: Event
        ReturnType: None
        Parameters:
          - total:
              DataType: Number
        Default: =Blank()
    Properties:
      Width: =360
      Height: =104
      OnReset: =Set(current,ClassicPanel.Seed)
    Children:
      - CaptionText:
          Control: ModernText@1.0.0
          Properties:
            Text: =ClassicPanel.Caption & " · " & ClassicPanel.Total
            X: =12
            Y: =4
            Width: =320
            Height: =32
      - IncreaseIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Add
            X: =12
            Y: =42
            Width: =48
            Height: =48
            TabIndex: =0
            Color: =RGBA(15,108,189,1)
            Fill: =RGBA(235,243,252,1)
            HoverFill: =RGBA(220,235,250,1)
            PressedFill: =RGBA(190,218,246,1)
            FocusedBorderColor: =Color.Orange
            FocusedBorderThickness: =3
            AccessibleLabel: ="Increase " & ClassicPanel.Caption
            OnSelect: =ClassicPanel.Increase()
      - Camera:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Camera
            X: =82
            Y: =42
            Width: =48
            Height: =48
            Color: =Color.DarkGreen
            AccessibleLabel: ="Decorative camera"
Screens:
  ClassicScreen:
    Properties:
      Fill: =Color.White
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Classic icons"
            X: =16
            Y: =8
            Width: =840
            Height: =32
      - Summary:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Left " & LeftPanel.Total & " · Right " & RightPanel.Total & " · callbacks " & CountRows(history) & " · " & status
            X: =16
            Y: =44
            Width: =840
            Height: =32
      - LeftPanel:
          Control: CanvasComponent
          ComponentName: ClassicPanel
          Properties:
            X: =16
            Y: =90
            Caption: ="LeftPanel"
            Seed: =10
            Changed: =Collect(history,{Panel:Self.Name,Total:total});Set(status,Self.Name & " captured " & total)
      - RightPanel:
          Control: CanvasComponent
          ComponentName: ClassicPanel
          Properties:
            X: =402
            Y: =90
            Caption: ="RightPanel"
            Seed: =100
            Changed: =Collect(history,{Panel:Self.Name,Total:total});Set(status,Self.Name & " captured " & total)
      - Modes:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Pointer image · keyboard button · decorative · disabled · view"
            X: =16
            Y: =200
            Width: =840
            Height: =32
      - Pointer:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Reload
            X: =16
            Y: =238
            Width: =72
            Height: =48
            AccessibleLabel: ="Rotate by pointer"
            Rotation: =angle
            PreserveAspectRatio: =false
            Color: =Color.DarkBlue
            Fill: =RGBA(240,245,255,1)
            HoverColor: =Color.Green
            PressedColor: =Color.Red
            OnSelect: =Set(angle,angle+45);Set(status,"Pointer rotated")
      - KeyboardBlank:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Check
            X: =108
            Y: =238
            Width: =48
            Height: =48
            TabIndex: =0
            AccessibleLabel: ="Blank keyboard button"
            FocusedBorderColor: =Color.Purple
            FocusedBorderThickness: =4
      - Decorative:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.BookmarkFilled
            X: =198
            Y: =238
            Width: =48
            Height: =48
      - Disabled:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Lock
            X: =290
            Y: =238
            Width: =48
            Height: =48
            TabIndex: =0
            AccessibleLabel: ="Disabled classic icon"
            DisplayMode: =DisplayMode.Disabled
            DisabledColor: =Color.Gray
            DisabledFill: =Color.LightGray
            OnSelect: =Set(status,"Unexpected disabled")
      - ReadOnly:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.View
            X: =380
            Y: =238
            Width: =48
            Height: =48
            TabIndex: =0
            AccessibleLabel: ="Read-only classic icon"
            DisplayMode: =DisplayMode.View
            OnSelect: =Set(status,"Unexpected view")
      - ResetLeft:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Reset left"
            X: =500
            Y: =246
            Width: =130
            OnSelect: =Reset(LeftPanel)
      - SaveSnapshot:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Save snapshot"
            Icon: =Icon.Save
            X: =650
            Y: =246
            Width: =170
            OnSelect: =Patch(Snapshots,Defaults(Snapshots),{Title:"Classic snapshot",Left:LeftPanel.Total,Right:RightPanel.Total,Selected:IconGallery.Selected.Name});Set(status,"Snapshot saved")
      - IconGallery:
