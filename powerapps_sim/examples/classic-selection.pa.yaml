App:
  Properties:
    StartScreen: =ClassicSelection
    OnStart: =Set(seed,false);Set(clearStage,false);Set(status,"Ready");Clear(history);Clear(trace)
ComponentDefinitions:
  ClassicSelectionPanel:
    AccessAppScope: false
    CustomProperties:
      Caption:
        PropertyKind: Input
        DataType: Text
        Default: ="Panel"
      EnabledSeed:
        PropertyKind: Input
        DataType: Boolean
        Default: =false
      StageSeed:
        PropertyKind: Input
        DataType: Text
        Default: ="Draft"
      Current:
        PropertyKind: Output
        DataType: Record
        Default: ={Enabled:Agree.Value,Stage:Choice.Selected.Code}
      Capture:
        PropertyKind: Action
        ReturnType: Record
        Parameters:
          - kind:
              DataType: Text
              Default: =""
              IsOptional: true
        Default: =Collect(captured,{Kind:kind,Enabled:Agree.Value,Stage:Choice.Selected.Code});ClassicSelectionPanel.Changed(ClassicSelectionPanel.Current);ClassicSelectionPanel.Current
      Changed:
        PropertyKind: Event
        ReturnType: None
        Parameters:
          - value:
              DataType: Record
              Default: ={Enabled:false,Stage:""}
              IsOptional: true
        Default: =Blank()
    Properties:
      Width: =420
      Height: =190
      OnReset: =Clear(captured);Clear(selects)
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            Text: =ClassicSelectionPanel.Caption
            X: =12
            Y: =0
            Width: =380
            Height: =32
      - Agree:
          Control: Classic/CheckBox@2.1.0
          Properties:
            X: =12
            Y: =36
            Width: =380
            Height: =44
            CheckboxSize: =24
            Default: =ClassicSelectionPanel.EnabledSeed
            Text: ="Enabled"
            AccessibleLabel: =ClassicSelectionPanel.Caption & " enabled"
            OnSelect: =Collect(selects,{Kind:"checkbox",Enabled:Self.Value})
            OnCheck: =ClassicSelectionPanel.Capture("check")
            OnUncheck: =ClassicSelectionPanel.Capture("uncheck")
      - Choice:
          Control: Classic/Radio@2.3.0
          Properties:
            X: =12
            Y: =88
            Width: =380
            Height: =110
            Items: =If(StartsWith(Language(),"fr"),Table({Code:"Draft",Caption:"Brouillon"},{Code:"Review",Caption:"À examiner"},{Code:"Done",Caption:"Terminé"}),Table({Code:"Draft",Caption:"Draft"},{Code:"Review",Caption:"In review"},{Code:"Done",Caption:"Completed"}))
            Value: ="Caption"
            RadioSize: =22
            Default: =LookUp(Self.Items,Code=ClassicSelectionPanel.StageSeed,Caption)
            AccessibleLabel: =ClassicSelectionPanel.Caption & " stage"
            OnSelect: =Collect(selects,{Kind:"radio",Enabled:Agree.Value})
            OnChange: =ClassicSelectionPanel.Capture("radio")
Screens:
  ClassicSelection:
    Properties:
      Fill: =Color.White
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Classic selection controls"
            X: =16
            Y: =8
            Width: =900
            Height: =32
      - Summary:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Callbacks " & CountRows(history) & " · " & status & " · unsaved " & Text(DraftForm.Unsaved)
            X: =16
            Y: =44
            Width: =900
            Height: =32
      - LeftPanel:
          Control: CanvasComponent
          ComponentName: ClassicSelectionPanel
          Properties:
            X: =16
            Y: =88
            Caption: ="LeftPanel"
            EnabledSeed: =false
            StageSeed: ="Draft"
            Changed: =Collect(history,{Panel:Self.Name,Enabled:value.Enabled,Stage:value.Stage});Set(status,Self.Name & " captured")
      - RightPanel:
          Control: CanvasComponent
          ComponentName: ClassicSelectionPanel
          Properties:
            X: =460
            Y: =88
            Caption: ="RightPanel"
            EnabledSeed: =true
            StageSeed: ="Review"
            Changed: =Collect(history,{Panel:Self.Name,Enabled:value.Enabled,Stage:value.Stage});Set(status,Self.Name & " captured")
      - Standalone:
          Control: Classic/CheckBox@2.1.0
          Properties:
            X: =16
            Y: =298
            Width: =240
            Height: =44
            CheckboxSize: =24
            Default: =seed
            Text: ="Standalone"
            AccessibleLabel: ="Standalone enabled"
            OnSelect: =Collect(trace,{Kind:"select",Enabled:Self.Value})
            OnCheck: =Collect(trace,{Kind:"check",Enabled:Self.Value})
            OnUncheck: =Collect(trace,{Kind:"uncheck",Enabled:Self.Value})
      - ReadOnly:
          Control: Classic/CheckBox@2.1.0
          Properties:
            X: =272
            Y: =298
            Width: =240
            Height: =44
            CheckboxSize: =24
            Default: =true
            Text: ="Read only"
            DisplayMode: =DisplayMode.View
      - Disabled:
          Control: Classic/CheckBox@2.1.0
          Properties:
            X: =516
            Y: =298
            Width: =240
            Height: =44
            CheckboxSize: =24
            Default: =false
            Text: ="Disabled"
            DisplayMode: =DisplayMode.Disabled
      - PointerOnly:
          Control: Classic/CheckBox@2.1.0
          Properties:
            X: =756
            Y: =298
            Width: =160
            Height: =44
            CheckboxSize: =24
            Default: =false
            Text: ="Pointer only"
            TabIndex: =-1
      - ResetLeft:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Reset left"
            X: =16
            Y: =362
            Width: =136
            OnSelect: =Reset(LeftPanel)
      - ChangeSeed:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Change default"
            X: =162
            Y: =362
            Width: =136
            OnSelect: =Set(seed,!seed)
      - ResetStandalone:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Reset checkbox"
            X: =320
            Y: =362
            Width: =136
            OnSelect: =Reset(Standalone)
      - ClearStage:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Clear stage"
            X: =480
            Y: =362
            Width: =136
            OnSelect: =Set(clearStage,true)
      - Restore:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Reset form"
            X: =620
            Y: =362
            Width: =136
            OnSelect: =Set(clearStage,false);ResetForm(DraftForm)
      - Save:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Save form"
            X: =764
            Y: =362
            Width: =136
            OnSelect: =SubmitForm(DraftForm)
      - DraftForm:
          Control: Form@2.4.4
          Properties:
            X: =16
            Y: =416
            Width: =900
            Height: =164
            DataSource: =Drafts
            Item: =LookUp(Drafts,ID=1)
            DefaultMode: =FormMode.Edit
            NumberOfColumns: =2
            OnSuccess: =Set(status,"Saved · enabled " & Text(Self.LastSubmit.'Is Enabled') & " · " & Self.LastSubmit.'Project Stage')
            OnFailure: =Set(status,"Save failed")
          Children:
            - EnabledCard:
                Control: TypedDataCard@1.0.7
                Properties:
                  DataField: ="Is Enabled"
                  Default: =ThisItem.'Is Enabled'
                  Required: =true
                  Update: =EnabledInput.Value
                  Width: =420
                  Height: =140
                Children:
                  - EnabledLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Saved Boolean (required)"
                        X: =0
                        Y: =0
                        Width: =380
                        Height: =32
                  - EnabledInput:
                      Control: Classic/CheckBox@2.1.0
                      Properties:
                        X: =0
                        Y: =36
                        Width: =380
                        Height: =44
                        CheckboxSize: =24
                        Default: =Parent.Default
                        DisplayMode: =Parent.DisplayMode
                        Text: ="Enabled"
                        AccessibleLabel: ="Saved enabled"
            - StageCard:
                Control: TypedDataCard@1.0.7
                Properties:
                  DataField: ="Project Stage"
                  Default: =ThisItem.'Project Stage'
                  Required: =true
                  Update: =StageInput.Selected.Code
                  Width: =420
                  Height: =140
                Children:
                  - StageLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Saved stage (required)"
                        X: =0
                        Y: =0
                        Width: =380
                        Height: =32
                  - StageInput:
                      Control: Classic/Radio@2.3.0
                      Properties:
                        X: =0
                        Y: =34
                        Width: =380
                        Height: =100
                        Items: =If(StartsWith(Language(),"fr"),Table({Code:"Draft",Caption:"Brouillon"},{Code:"Review",Caption:"À examiner"},{Code:"Done",Caption:"Terminé"}),Table({Code:"Draft",Caption:"Draft"},{Code:"Review",Caption:"In review"},{Code:"Done",Caption:"Completed"}))
                        Value: ="Caption"
                        RadioSize: =22
                        Layout: =Layout.Horizontal
                        Default: =If(clearStage,Blank(),LookUp(Self.Items,Code=Parent.Default,Caption))
                        DisplayMode: =Parent.DisplayMode
                        AccessibleLabel: ="Saved stage"
      - RowsLabel:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Live list rows"
            X: =16
            Y: =594
            Width: =900
            Height: =32
      - Rows:
          Control: Gallery@2.15.0
          Properties:
            X: =16
            Y: =630
            Width: =900
            Height: =154
            TemplateSize: =60
            TemplatePadding: =4
            Items: =Drafts
            OnSelect: =Set(status,"Selected " & Self.Selected.'Project Title')
          Children:
            - RowTitle:
                Control: ModernText@1.0.0
                Properties:
                  Text: =ThisItem.'Project Title'
                  X: =12
                  Y: =10
                  Width: =450
                  Height: =32
            - RowEnabled:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  X: =480
                  Y: =8
                  Width: =260
                  Height: =40
                  CheckboxSize: =24
                  Default: =ThisItem.'Is Enabled'
                  Text: ="Enabled"
                  AccessibleLabel: =ThisItem.'Project Title' & " enabled"
                  OnSelect: =Select(Parent)
                  OnCheck: =Patch(Drafts,ThisItem,{Enabled:true})
                  OnUncheck: =Patch(Drafts,ThisItem,{Enabled:false})
