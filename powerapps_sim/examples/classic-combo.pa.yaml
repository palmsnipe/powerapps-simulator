App:
  Properties:
    StartScreen: =ClassicComboLab
    OnStart: =Clear(events);Clear(results);Clear(saves);Set(status,"Ready");Set(navigated,"");Reset(LeftPicker);Reset(RightPicker)
    Formulas: =T(en:Text,fr:Text):Text=If(StartsWith(Language(),"fr"),fr,en);
ComponentDefinitions:
  PeoplePicker:
    AccessAppScope: false
    CustomProperties:
      Caption:
        PropertyKind: Input
        DataType: Text
        Default: ="People"
      Records:
        PropertyKind: Input
        DataType: Table
        Default: =Table()
      Initial:
        PropertyKind: Input
        DataType: Table
        Default: =Table()
      Chosen:
        PropertyKind: Output
        DataType: Table
        Default: =Pick.SelectedItems
      Latest:
        PropertyKind: Output
        DataType: Record
        Default: =Pick.Selected
      History:
        PropertyKind: Output
        DataType: Table
        Default: =history
      Picked:
        PropertyKind: Event
        ReturnType: None
        Parameters:
          - value:
              DataType: Record
              Default: ={ID:0,DisplayName:"",Email:""}
              IsOptional: true
        Default: =Blank()
      Navigated:
        PropertyKind: Event
        ReturnType: None
        Parameters:
          - value:
              DataType: Record
              Default: ={ID:0,DisplayName:"",Email:""}
              IsOptional: true
        Default: =Blank()
    Properties:
      Width: =430
      Height: =165
      OnReset: =Clear(history);Reset(Pick)
    Children:
      - Caption:
          Control: ModernText@1.0.0
          Properties:
            Text: =PeoplePicker.Caption
            X: =0
            Y: =0
            Width: =350
            Height: =32
      - Pick:
          Control: Classic/ComboBox@2.4.0
          Properties:
            X: =0
            Y: =36
            Width: =415
            Height: =42
            Items: =PeoplePicker.Records
            DefaultSelectedItems: =PeoplePicker.Initial
            DisplayFields: =["DisplayName","Email"]
            SearchFields: =["DisplayName","Email"]
            Template: =ListItemTemplate.Person
            NavigateFields: =["Email"]
            OnChange: =Collect(history,{Names:Concat(Self.SelectedItems,DisplayName,", "),Count:CountRows(Self.SelectedItems),Latest:Self.Selected.DisplayName});PeoplePicker.Picked(Self.Selected)
            OnNavigate: =PeoplePicker.Navigated(Self.NavigateItem)
            AccessibleLabel: =PeoplePicker.Caption & " picker"
      - Counts:
          Control: ModernText@1.0.0
          Properties:
            Text: =$"{CountRows(Pick.SelectedItems)} selected · {CountRows(history)} changes"
            X: =0
            Y: =88
            Width: =350
            Height: =32
      - LatestName:
          Control: ModernText@1.0.0
          Properties:
            Text: '="Latest: " & Coalesce(Pick.Selected.DisplayName,"None")'
            X: =0
            Y: =122
            Width: =350
            Height: =32
Screens:
  ClassicComboLab:
    Properties:
      Width: =940
      Height: =620
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            Text: =T("Classic ComboBox · people and drafts","ComboBox classique · personnes et brouillons")
            X: =16
            Y: =10
            Width: =900
            Height: =32
      - Status:
          Control: ModernText@1.0.0
          Properties:
            Text: '=$"{status} · {CountRows(events)} events · Navigate: {navigated}"'
            X: =16
            Y: =46
            Width: =900
            Height: =32
      - LeftPicker:
          Control: CanvasComponent
          ComponentName: PeoplePicker
          Properties:
            X: =16
            Y: =86
            Width: =430
            Height: =165
            Caption: =T("Left","Gauche")
            Records: =People
            Initial: =Table(First(People))
            Picked: =Collect(events,{Panel:"Left",Name:value.DisplayName});Set(status,Coalesce(value.DisplayName,"Cleared"))
            Navigated: =Set(navigated,value.DisplayName)
      - RightPicker:
          Control: CanvasComponent
          ComponentName: PeoplePicker
          Properties:
            X: =480
            Y: =86
            Width: =430
            Height: =165
            Caption: =T("Right","Droite")
            Records: =People
            Initial: =Table(Last(People))
            Picked: =Collect(events,{Panel:"Right",Name:value.DisplayName});Set(status,Coalesce(value.DisplayName,"Cleared"))
            Navigated: =Set(navigated,value.DisplayName)
      - Single:
          Control: Classic/ComboBox@2.3.0
          Properties:
            X: =16
            Y: =264
            Width: =360
            Height: =42
            Items: =People
            DisplayFields: =["DisplayName"]
            SearchFields: =["Email"]
            DefaultSelectedItems: =First(People)
            SelectMultiple: =false
            IsSearchable: =false
            AccessibleLabel: ="Single person"
            OnChange: =Set(status,Coalesce(Self.Selected.DisplayName,"Cleared"))
      - ResetLeft:
          Control: ModernButton@1.0.0
          Properties:
            Text: =T("Reset left","Réinitialiser")
            OnSelect: =Reset(LeftPicker)
            X: =402
            Y: =268
            Width: =130
      - BuildTable:
          Control: ModernButton@1.0.0
          Properties:
            Text: =T("Build table","Créer table")
            OnSelect: =ClearCollect(results,ForAll(Sequence(8),{ID:Value,Name:LeftPicker.Latest.DisplayName,Count:CountRows(LeftPicker.Chosen),N01:Value,N02:Value,N03:Value,N04:Value,N05:Value,N06:Value,N07:Value,N08:Value,N09:Value,N10:Value,N11:Value,N12:Value,N13:Value,N14:Value,N15:Value,N16:Value,Details:{Right:RightPicker.Latest.DisplayName,Language:Language()}}));Set(status,"Table ready")
            X: =558
            Y: =268
            Width: =130
      - DraftForm:
          Control: Form@2.4.4
          Properties:
            X: =16
            Y: =346
            Width: =900
            Height: =188
            DataSource: =Drafts
            Item: =First(Drafts)
            NumberOfColumns: =2
            OnSuccess: =Set(status,T("Saved","Enregistré"));Collect(saves,Self.LastSubmit)
            OnFailure: =Set(status,T("Save failed","Échec"))
          Children:
            - TitleCard:
                Control: TypedDataCard@1.0.7
                Properties:
                  DataField: ="Title"
                  Default: =ThisItem.Title
                  Update: =TitleInput.Text
                  Required: =true
                  Width: =430
                  Height: =90
                Children:
                  - TitleLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =T("Title","Titre")
                        X: =0
                        Y: =0
                        Width: =350
                        Height: =32
                  - TitleInput:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: =Parent.Default
                        X: =0
                        Y: =34
                        Width: =410
                        Height: =40
                        AccessibleLabel: =T("Draft title","Titre du brouillon")
            - OwnersCard:
                Control: TypedDataCard@1.0.7
                Properties:
                  DataField: ="Owners"
                  Default: =ThisItem.Owners
                  Update: =OwnerInput.SelectedItems
                  Required: =true
                  Width: =430
                  Height: =130
                Children:
                  - OwnerLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =T("Owners","Responsables")
                        X: =0
                        Y: =0
                        Width: =350
                        Height: =32
                  - OwnerInput:
                      Control: Classic/ComboBox@2.3.1
                      Properties:
                        Items: =People
                        DefaultSelectedItems: =Parent.Default
                        DisplayFields: =["DisplayName","Email"]
                        SearchFields: =["Email"]
                        Template: =ListItemTemplate.Double
                        Width: =410
                        Height: =42
                        X: =0
                        Y: =34
                        AccessibleLabel: =T("Draft owners","Responsables du brouillon")
                        OnChange: =Set(status,"Draft edited")
      - Save:
          Control: ModernButton@1.0.0
          Properties:
            Text: =T("Save draft","Enregistrer")
            OnSelect: =SubmitForm(DraftForm)
            X: =16
            Y: =546
            Width: =130
      - ResetDraft:
          Control: ModernButton@1.0.0
          Properties:
            Text: =T("Reset draft","Réinitialiser")
            OnSelect: =ResetForm(DraftForm)
            X: =170
            Y: =546
            Width: =130
      - Saves:
          Control: ModernText@1.0.0
          Properties:
            Text: =$"{CountRows(saves)} saved drafts"
            X: =350
            Y: =546
            Width: =350
            Height: =32
