ComponentDefinitions:
  CounterPanel:
    AccessAppScope: false
    CustomProperties:
      Seed:
        PropertyKind: Input
        DataType: Number
        RaiseOnReset: true
        Default: =0
      Caption:
        PropertyKind: Input
        DataType: Text
        Default: ="Counter"
      ViewOnly:
        PropertyKind: Input
        DataType: Boolean
        Default: =false
      Rotation:
        PropertyKind: Input
        DataType: Number
        Default: =0
      Current:
        PropertyKind: Output
        DataType: Number
        Default: =Coalesce(localCount,CounterPanel.Seed)
      History:
        PropertyKind: Output
        DataType: Table
        Default: =history
      Changed:
        PropertyKind: Event
        ReturnType: None
        Parameters:
          - count:
              DataType: Number
        Default: =Blank()
    Properties:
      Width: =440
      Height: =CurrentLabel.Y+CurrentLabel.Height+12
      OnReset: =Set(localCount,CounterPanel.Seed);Clear(history)
    Children:
      - CaptionLabel:
          Control: Text@0.0.47
          Properties:
            Text: =CounterPanel.Caption
            X: =12
            Y: =8
            Width: =Parent.Width-24
            Size: =18
      - Increase:
          Control: FluentV8/Label@1.6.0
          Properties:
            Text: =CounterPanel.Caption & " +1"
            OnSelect: =Set(localCount,CounterPanel.Current+1);Collect(history,{Action:"add",Count:localCount});CounterPanel.Changed(localCount)
            X: =12
            Y: =48
            Width: =150
            Height: =36
            DisplayMode: =If(CounterPanel.ViewOnly,DisplayMode.View,DisplayMode.Edit)
            FontSize: =12
            FontWeight: =FontWeight.Semibold
            Alignment: =Align.Center
            PaddingStart: =8
            PaddingEnd: =8
            TextRole: =TextRole.Default
            Tooltip: =CounterPanel.Caption
            AutoHeight: =true
      - Decrease:
          Control: FluentV8/Label@1.6.0
          Properties:
            Text: =CounterPanel.Caption & " -1"
            OnSelect: =Set(localCount,CounterPanel.Current-1);Collect(history,{Action:"subtract",Count:localCount});CounterPanel.Changed(localCount)
            X: =176
            Y: =48
            Width: =150
            Height: =36
            DisplayMode: =If(CounterPanel.ViewOnly,DisplayMode.View,DisplayMode.Edit)
            FontSize: =12
            FontWeight: =FontWeight.Semibold
            Alignment: =Align.Center
            PaddingStart: =8
            PaddingEnd: =8
            TextRole: =TextRole.Default
            Tooltip: =CounterPanel.Caption
            AutoHeight: =true
      - CurrentLabel:
          Control: Text@0.0.47
          Properties:
            Text: =Text(CounterPanel.Current) & " · " & CountRows(history)
            X: =12
            Y: =Max(Increase.Y+Increase.Height,Decrease.Y+Decrease.Height)+8
            Width: =Parent.Width-24
