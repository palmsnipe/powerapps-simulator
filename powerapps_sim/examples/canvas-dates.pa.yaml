App:
  Properties:
    StartScreen: =Home
    OnStart: =Set(initialDay,Date(2026,1,15));Clear(events);Set(status,"Ready");Reset(Left);Reset(Right)
    Formulas: =T(en:Text,fr:Text):Text=If(StartsWith(Language(),"fr"),fr,en);
Screens:
  Home:
    Properties:
      Height: =Max(App.Height,Save.Y+70)
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            Text: =T("Fictional date planner","Planification fictive")
            X: =20
            Y: =12
            Width: =Parent.Width-40
            Size: =24
      - Left:
          Control: CanvasComponent
          ComponentName: DatePanel
          Properties:
            X: =20
            Y: =65
            Width: =If(App.Width<760,Parent.Width-40,Parent.Width/2-40)
            InitialDay: =initialDay
            Caption: =T("Left date","Date gauche")
            Changed: =Collect(events,{Panel:"Left",Day:day})
      - Right:
          Control: CanvasComponent
          ComponentName: DatePanel
          Properties:
            X: =If(App.Width<760,20,Parent.Width/2+10)
            Y: =If(App.Width<760,Left.Y+Left.Height+20,Left.Y)
            Width: =If(App.Width<760,Parent.Width-40,Parent.Width/2-40)
            InitialDay: =Date(2026,7,15)
            Caption: =T("Right date","Date droite")
            Changed: =Collect(events,{Panel:"Right",Day:day})
      - ResetLeft:
          Control: ModernButton@1.0.0
          Properties:
            Text: =T("Reset left","Réinitialiser")
            X: =20
            Y: =Right.Y+Right.Height+12
            Width: =140
            OnSelect: =Reset(Left)
      - NewDefault:
          Control: ModernButton@1.0.0
          Properties:
            Text: =T("New default","Nouvelle date")
            X: =180
            Y: =ResetLeft.Y
            Width: =140
            OnSelect: =Set(initialDay,Date(2026,3,4))
      - Month:
          Control: DatePicker@0.0.38
          Properties:
            X: =20
            Y: =ResetLeft.Y+50
            Width: =Parent.Width-40
            SelectedDate: =Date(2026,1,15)
            Format: =DatePickerCanvas.Format.YearMonth
            AccessibleLabel: ="Month planning date"
      - PlanForm:
          Control: Form@2.4.4
          Properties:
            DataSource: =Plans
            Item: =First(Plans)
            NumberOfColumns: =1
            X: =20
            Y: =Month.Y+60
            Width: =Parent.Width-40
            Height: =160
            OnSuccess: =Set(status,"Saved")
            OnFailure: =Set(status,PlanForm.Error)
          Children:
            - DayCard:
                Control: TypedDataCard@1.0.7
                Variant: ClassicDateEdit
                Properties:
                  DataField: ="TargetDay"
                  Default: =ThisItem.TargetDay
                  Update: =FormDay.SelectedDate
                  Required: =true
                  Height: =120
                Children:
                  - Label:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =T("Target date","Date cible")
                        X: =12
                        Y: =4
                        Width: =Parent.Width-24
                  - FormDay:
                      Control: DatePicker@0.0.42
                      Properties:
                        X: =12
                        Y: =48
                        Width: =Parent.Width-24
                        SelectedDate: =Parent.Default
                        IsEditable: =true
                        Format: =DatePickerCanvas.Format.Short
                        Required: =Parent.Required
                        AccessibleLabel: ="Target date"
      - Save:
          Control: ModernButton@1.0.0
          Properties:
            Text: =T("Save","Enregistrer")
            X: =20
            Y: =PlanForm.Y+PlanForm.Height+12
            Width: =140
            OnSelect: =SubmitForm(PlanForm)
      - Status:
          Control: ModernText@1.0.0
          Properties:
            X: =180
            Y: =Save.Y
            Width: =Parent.Width-200
            Text: =status & If(PlanForm.Unsaved," · edited","")
