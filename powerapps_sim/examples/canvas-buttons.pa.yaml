App:
  Properties:
    StartScreen: =Home
    Formulas: =T(en:Text,fr:Text):Text=If(StartsWith(Language(),"fr"),fr,en);
    OnStart: =Set(seed,0);Set(viewOnly,false);Set(rotation,0);Set(rootClicks,0);Set(status,"Ready");Clear(events);Clear(styles);Reset(Left);Reset(Right)
Screens:
  Home:
    Properties:
      Height: =Max(App.Height,Status.Y+50)
    Children:
      - Heading:
          Control: ModernText@1.0.0
          Properties:
            Text: =T("Archived buttons · actions and components","Boutons archivés · actions et composants")
            X: =20
            Y: =12
            Width: =Parent.Width-40
            Height: =40
            AutoHeight: =true
            Size: =24
      - Left:
          Control: CanvasComponent
          Properties:
            X: =20
            Y: =Heading.Y+Heading.Height+12
            Width: =If(App.Width<760,Parent.Width-40,Parent.Width/2-40)
            Seed: =seed
            Caption: =T("Left counter","Compteur gauche")
            ViewOnly: =viewOnly
            Rotation: =rotation
            Changed: =Collect(events,{Panel:"Left",Count:count})
          ComponentName: CounterPanel
      - Right:
          Control: CanvasComponent
          Properties:
            X: =If(App.Width<760,20,Parent.Width/2+10)
            Y: =If(App.Width<760,Left.Y+Left.Height+12,Left.Y)
            Width: =If(App.Width<760,Parent.Width-40,Parent.Width/2-40)
            Seed: =10
            Caption: =T("Right counter","Compteur droite")
            ViewOnly: =viewOnly
            Rotation: =rotation
            Changed: =Collect(events,{Panel:"Right",Count:count})
          ComponentName: CounterPanel
      - ResetLeft:
          Control: Button@0.0.44
          Properties:
            Text: =T("Reset left","Réinitialiser")
            OnSelect: =Reset(Left)
            X: =20
            Y: =Right.Y+Right.Height+12
            Width: =150
            Height: =36
      - NewSeed:
          Control: Button@0.0.43
          Properties:
            Text: =T("New seed","Nouvelle valeur")
            OnSelect: =Set(seed,5)
            X: =180
            Y: =ResetLeft.Y
            Width: =150
            Height: =36
      - ToggleView:
          Control: Button@0.0.44
          Properties:
            Text: =T("Toggle view","Mode lecture")
            OnSelect: =Set(viewOnly,!viewOnly)
            X: =If(App.Width<520,20,340)
            Y: =If(App.Width<520,ResetLeft.Y+44,ResetLeft.Y)
            Width: =150
            Height: =36
      - Rotate:
          Control: Button@0.0.44
          Properties:
            Text: =T("Rotate icons","Pivoter les icônes")
            OnSelect: =Set(rotation,Mod(rotation+45,360))
            X: =If(App.Width<680,180,500)
            Y: =If(App.Width<680,ResetLeft.Y+44,ResetLeft.Y)
            Width: =150
            Height: =36
            FontUnderline: =true
      - FocusTarget:
          Control: Button@0.0.44
          Properties:
            Text: =T("Focus target","Cible de focus")
            OnSelect: =Set(rootClicks,rootClicks+1)
            X: =20
            Y: =Max(ToggleView.Y,Rotate.Y)+48
            Width: =150
            Height: =36
            Icon: ="Target"
            Layout: =ButtonCanvas.Layout.TextOnly
      - FocusTargetAction:
          Control: Button@0.0.43
          Properties:
            Text: =T("Focus button","Viser le bouton")
            OnSelect: =SetFocus(FocusTarget)
            X: =180
            Y: =FocusTarget.Y
            Width: =150
            Height: =36
      - Styles:
          Control: Gallery@2.15.0
          Properties:
            Items: =Table({Name:"Primary"},{Name:"Secondary"},{Name:"Outline"},{Name:"Subtle"},{Name:"Transparent"})
            X: =20
            Y: =FocusTarget.Y+52
            Width: =Parent.Width-40
            Height: =If(App.Width<680,144,48)
            TemplateSize: =44
            TemplatePadding: =4
            WrapCount: =If(App.Width<680,2,5)
          Children:
            - Style:
                Control: Button@0.0.44
                Properties:
                  Text: =ThisItem.Name
                  OnSelect: =Collect(styles,{Name:ThisItem.Name})
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth-8
                  Height: =36
                  Appearance: =ThisItem.Name
                  FontColor: =If(ThisItem.Name="Primary",Color.White,Color.Black)
      - PlanForm:
          Control: Form@2.4.4
          Properties:
            DataSource: =Plans
            Item: =First(Plans)
            NumberOfColumns: =1
            X: =20
            Y: =Styles.Y+Styles.Height+12
            Width: =Parent.Width-40
            Height: =100
            OnSuccess: =Set(status,"Saved")
            OnFailure: =Set(status,PlanForm.Error)
          Children:
            - AmountCard:
                Control: TypedDataCard@1.0.7
                Properties:
                  DataField: ="AmountValue"
                  Default: =ThisItem.AmountValue
                  Update: =Value(AmountInput.Value)
                  Required: =true
                  Height: =85
                Variant: TextualEdit
                Children:
                  - AmountLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =T("Local amount","Montant local")
                        X: =12
                        Y: =4
                        Width: =Parent.Width-24
                  - AmountInput:
                      Control: TextInput@0.0.53
                      Properties:
                        Value: =Text(Parent.Default)
                        X: =12
                        Y: =38
                        Width: =Parent.Width-24
                        Height: =32
                        AccessibleLabel: ="Amount"
      - Save:
          Control: Button@0.0.43
          Properties:
            Text: =T("Save","Enregistrer")
            OnSelect: =SubmitForm(PlanForm)
            X: =20
            Y: =PlanForm.Y+PlanForm.Height+12
            Width: =150
            Height: =36
      - Discard:
          Control: Button@0.0.44
          Properties:
            Text: =T("Discard","Annuler")
            OnSelect: =ResetForm(PlanForm)
            X: =180
            Y: =Save.Y
            Width: =150
            Height: =36
      - Status:
          Control: ModernText@1.0.0
          Properties:
            Text: =status & If(PlanForm.Unsaved," · edited","")
            X: =20
            Y: =Save.Y+44
            Width: =Parent.Width-40
