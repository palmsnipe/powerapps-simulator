App:
  Properties:
    StartScreen: =Home
    OnStart: =Set(chosenLocale,"es-ES");Clear(history);ClearCollect(localeNames,{Language:"es-ES"},{Language:"de-DE"},{Language:"ja-JP"})
Screens:
  Home:
    Children:
      - Title:
          Control: ModernText@1.0.0
          Properties:
            X: =24
            Y: =12
            Width: =Parent.Width-48
            Height: =36
            Text: ="Localized values"
      - Panels:
          Control: GroupContainer@1.5.0
          Properties:
            X: =24
            Y: =64
            Width: =Parent.Width-48
            Height: =If(Self.Width<544,364,170)
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutWrap: =true
            LayoutGap: =24
            LayoutAlignItems: =LayoutAlignItems.Start
          Children:
            - Left:
                Control: CanvasComponent
                Properties:
                  Width: =400
                  Height: =170
                  LayoutMinWidth: =260
                  FillPortions: =1
                  Locale: =chosenLocale
                  Seed: ="123,456"
                  Changed: =Collect(history,{Panel:"Left",Amount:amount,Language:localeTag})
                ComponentName: LocaleCard
            - Right:
                Control: CanvasComponent
                Properties:
                  Width: =400
                  Height: =170
                  LayoutMinWidth: =260
                  FillPortions: =1
                  Locale: ="en-US"
                  Seed: ="123,456"
                  Changed: =Collect(history,{Panel:"Right",Amount:amount,Language:localeTag})
                ComponentName: LocaleCard
          Variant: AutoLayout
      - Spanish:
          Control: ModernButton@1.0.0
          Properties:
            X: =24
            Y: =Panels.Y+Panels.Height+16
            Width: =120
            Text: ="Spanish"
            OnSelect: =Set(chosenLocale,"es-ES")
      - German:
          Control: ModernButton@1.0.0
          Properties:
            X: =154
            Y: =Panels.Y+Panels.Height+16
            Width: =120
            Text: ="German"
            OnSelect: =Set(chosenLocale,"de-DE")
      - Japanese:
          Control: ModernButton@1.0.0
          Properties:
            X: =284
            Y: =Panels.Y+Panels.Height+16
            Width: =120
            Text: ="Japanese"
            OnSelect: =Set(chosenLocale,"ja-JP")
      - Save:
          Control: ModernButton@1.0.0
          Properties:
            X: =24
            Y: =Panels.Y+Panels.Height+60
            Width: =180
            Text: ="Save localized amount"
            DisplayMode: =If(Left.Valid,DisplayMode.Edit,DisplayMode.Disabled)
            OnSelect: =If(Left.Valid,Patch(Amounts,Defaults(Amounts),{Title:"Fictional localized amount",Amount:Left.Amount,Language:chosenLocale}))
      - Count:
          Control: ModernText@1.0.0
          Properties:
            X: =220
            Y: =Panels.Y+Panels.Height+60
            Width: =180
            Text: ="Saved locally · " & CountRows(Amounts)
