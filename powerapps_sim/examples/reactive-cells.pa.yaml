App:
  Properties:
    StartScreen: =ReactiveLab
    OnStart: =Set(counter,0);Set(randomPick,false);Set(saved,false);Set(remembered,Blank());Clear(saves)
    Formulas: =Seeded=Rand();
Screens:
  ReactiveLab:
    Properties:
      Width: =App.Width
      Height: =App.Height
    Children:
    - Heading:
        Control: ModernText@1.0.0
        Properties:
          Text: ="Reactive cells and defaults"
          X: =20
          Y: =8
          Width: =900
          Height: =30
    - ClassicLabel:
        Control: ModernText@1.0.0
        Properties:
          Text: ="Classic table"
          X: =20
          Y: =48
          Width: =440
          Height: =30
    - GridLabel:
        Control: ModernText@1.0.0
        Properties:
          Text: ="Modern grid"
          X: =510
          Y: =48
          Width: =440
          Height: =30
    - Classic:
        Control: DataTable@1.0.2
        Properties:
          Items: =Cards
          X: =20
          Y: =84
          Width: =460
          Height: =176
        Children:
        - ClassicTitle:
            Control: DataTableColumn@1.0.1
            Properties:
              Text: =ThisItem.Title
              Width: =210
              FieldDisplayName: ="Card"
              FieldName: ="Title"
              Order: =1
        - ClassicFixed:
            Control: DataTableColumn@1.0.1
            Properties:
              Text: =Text(Rand(),"0.000000")
              Width: =210
              FieldDisplayName: ="Fixed"
              FieldName: ="Amount"
              Order: =2
        - ClassicRoll:
            Control: DataTableColumn@1.0.1
            Properties:
              Text: =Text(ThisItem.Amount+Rand(),"0.000000")
              Width: =210
              FieldDisplayName: ="Amount + Rand"
              FieldName: ="Amount"
              Order: =3
    - Grid:
        Control: ModernDataGrid@1.1.0
        Properties:
          Items: =Cards
          X: =510
          Y: =84
          Width: =460
          Height: =176
          Searchable: =true
          Sortable: =true
          DefaultSelectedItems: =FirstN(Cards,1)
        Children:
        - GridTitle:
            Control: ModernDataGridColumn@1.1.0
            Properties:
              Text: =ThisItem.Title
              Width: =210
              FieldDisplayName: ="Card"
            Variant: Textual
        - GridFixed:
            Control: ModernDataGridColumn@1.1.0
            Properties:
              Text: =Text(Rand(),"0.000000")
              Width: =210
              FieldDisplayName: ="Fixed"
            Variant: Textual
        - GridRoll:
            Control: ModernDataGridColumn@1.1.0
            Properties:
              Text: =Text(ThisItem.Amount+Rand(),"0.000000")
              Width: =210
              FieldDisplayName: ="Amount + Rand"
            Variant: Textual
    - Unrelated:
        Control: ModernButton@1.0.0
        Properties:
          Text: ="Unrelated change"
          OnSelect: =Set(counter,counter+1)
          X: =20
          Y: =280
          Width: =160
          Height: =36
    - ChangeFirst:
        Control: ModernButton@1.0.0
        Properties:
          Text: ="Increase first budget"
          OnSelect: =Patch(Cards,LookUp(Cards,ID=1),{Amount:LookUp(Cards,ID=1).Amount+1})
          X: =200
          Y: =280
          Width: =220
          Height: =36
    - Remember:
        Control: ModernButton@1.0.0
        Properties:
          Text: ="Remember defaults"
          OnSelect: =Set(remembered,{Draft:AmountInput.Text,Item:Editor.Item.ID,Classic:Classic.Selected.ID,Fixed:GridFixed.Text,Roll:GridRoll.Text})
          X: =440
          Y: =280
          Width: =210
          Height: =36
    - RandomPick:
        Control: ModernButton@1.0.0
        Properties:
          Text: ="Random item"
          OnSelect: =Set(randomPick,true)
          X: =670
          Y: =280
          Width: =160
          Height: =36
    - Editor:
        Control: Form@2.4.4
        Properties:
          DataSource: =Cards
          Item: =If(randomPick,Index(Cards,RandBetween(1,CountRows(Cards))),Grid.Selected)
          X: =20
          Y: =340
          Width: =360
          Height: =100
          NumberOfColumns: =1
          OnSuccess: =Set(saved,true);Collect(saves,Self.LastSubmit)
          OnFailure: =Set(saved,false)
        Children:
        - AmountCard:
            Control: TypedDataCard@1.0.7
            Properties:
              DataField: ="Amount"
              Default: =Text(ThisItem.Amount+Rand(),"0.000000")
              Update: =Value(AmountInput.Text)
              X: =0
              Y: =0
              Width: =360
              Height: =80
            Children:
            - Label:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Budget"
                  X: =12
                  Y: =0
                  Width: =320
                  Height: =30
            - AmountInput:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =Parent.Default
                  AccessibleLabel: ="Budget draft"
                  X: =12
                  Y: =34
                  Width: =320
                  Height: =36
    - Item:
        Control: ModernText@1.0.0
        Properties:
          Text: '="Item: " & Editor.Item.Title'
          X: =400
          Y: =342
          Width: =560
          Height: =30
    - Draft:
        Control: ModernText@1.0.0
        Properties:
          Text: '="Draft: " & AmountInput.Text'
          X: =400
          Y: =378
          Width: =560
          Height: =30
    - Save:
        Control: ModernButton@1.0.0
        Properties:
          Text: ="Save budget"
          OnSelect: =SubmitForm(Editor)
          X: =20
          Y: =454
          Width: =160
          Height: =36
    - Reset:
        Control: ModernButton@1.0.0
        Properties:
          Text: ="Reset draft"
          OnSelect: =ResetForm(Editor)
          X: =200
          Y: =454
          Width: =160
          Height: =36
    - Counter:
        Control: ModernText@1.0.0
        Properties:
          Text: '="Unrelated changes: " & counter'
          X: =400
          Y: =458
          Width: =440
          Height: =30
    - Decorations:
        Control: Gallery@2.15.0
        Properties:
          Items: =Cards As card
          X: =20
          Y: =516
          Width: =950
          Height: =140
          TemplateSize: =34
          TemplateFill: =RGBA(245,RandBetween(230,245),245,1)
          ItemAccessibleLabel: =card.Title & " " & Text(Rand(),"0.000000")
        Variant: Vertical
        Children:
        - Title:
            Control: ModernText@1.0.0
            Properties:
              Text: =ThisItem.Title
              X: =12
              Y: =0
              Width: =900
              Height: =30
